[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-relate"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "RelateGraphSaver Contributors" },
]
dynamic = [
    "description",
]
keywords = [
    "langgraph",
    "relate",
    "neo4j",
    "checkpointer",
    "persistence",
    "agent",
    "dag",
    "cypher",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: LangGraph",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langgraph-checkpoint>=2.0.0",
    "langgraph>=0.2.0",
    "relate-db>=1.1.0",
    "typer>=0.12.0",
    "click>=8.1.0",
    "langchain-core>=0.2.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/jegadeesh17/RelateGraphSaver"
Repository = "https://github.com/jegadeesh17/RelateGraphSaver"
Issues = "https://github.com/jegadeesh17/RelateGraphSaver/issues"
Documentation = "https://github.com/jegadeesh17/RelateGraphSaver#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
llm = [
    "langchain-openai>=1.8.3",
]

[project.scripts]
relate-dag = "langgraph_checkpoint_relate.cli:app"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_checkpoint_relate"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: calls pypi.org, deselected unless -m names it (run with '-m network')",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langchain_openai"]
ignore_missing_imports = true
